services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fdp_app
    working_dir: /app
    volumes:
      - .:/app
      - ../FDPfiles:/app/public/FDPfiles
      - ../SSPfiles:/app/public/SSPfiles
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      - db
    expose:
      - "9000"
    ports:
      - "3000:3000"
    environment:
      APP_ENV: local
      # MODE: development
      TAILWIND_WATCH: "1"

  nginx:
    image: nginx:latest
    container_name: fdp_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ../FDPfiles:/app/public/FDPfiles
      - ../SSPfiles:/app/public/SSPfiles
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: fdp_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    volumes:
      - db_data:/var/lib/mysql

  scheduler:
    image: fdpnew-app
    container_name: fdp_scheduler
    restart: unless-stopped
    user: www-data
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["php", "artisan", "schedule:work"]
    depends_on:
      - app
      - db

  queue:
    image: fdpnew-app
    container_name: fdp_queue
    restart: unless-stopped
    user: www-data
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=1", "--timeout=300"]
    depends_on:
      - app
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fdp_pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
    name: fdpnew_db_data


